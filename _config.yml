theme: jekyll-theme-architect
description: Quantego is a family of LEGO models of IBM Quantum Computers
url: https://quantego.org
# /sitemap.xml and /robots.txt (with its Sitemap line), generated by GitHub Pages
plugins:
  - jekyll-sitemap
# Link previews (og:image / twitter:image via jekyll-seo-tag): the three models
# side by side, rendered with _render.html. With an image the Twitter card
# becomes summary_large_image.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-image.png
        width: 1200
        height: 630
        alt: The three Quantego LEGO models side by side, from small to the 1024-brick model
