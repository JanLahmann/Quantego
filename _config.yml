theme: jekyll-theme-architect
description: Quantego is a family of LEGO models of IBM Quantum Computers
# Search title "Quantego | <tagline>" (jekyll-seo-tag); the header keeps showing the description
tagline: LEGO models of IBM quantum computers
url: https://quantego.org
# /sitemap.xml and /robots.txt (with its Sitemap line), generated by GitHub Pages
plugins:
  - jekyll-sitemap
defaults:
  # Search and link-preview description of the page (the header keeps the short one)
  - scope:
      path: ""
      type: pages
    values:
      description: LEGO models of IBM Quantum System One and System Two, from 49 to 1024 bricks, with free build instructions, parts lists, Studio files and 3D viewers.
  # Byte-identical copies of the instruction PDFs linked on the page; kept for old
  # links, left out of the sitemap
  - scope:
      path: Quantego-Instructions-2a.pdf
    values:
      sitemap: false
  - scope:
      path: Quantego_instructions.pdf
    values:
      sitemap: false
